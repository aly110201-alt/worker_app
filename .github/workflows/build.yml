name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App Without Codesign
        run: flutter build ios --release --no-codesign --no-pub

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          # في حال تم حفظ مخرج التجميع في مجلد المحاكي أو الجهاز
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            cp -r build/ios/iphoneos/Runner.app Payload/
          else
            cp -r build/ios/iphonesimulator/Runner.app Payload/
          fi
          zip -r worker_app.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: worker_app_ipa
          path: worker_app.ipa
